# Streamlit runtime config. Theme + telemetry. Server flags live in the
# Dockerfile ENTRYPOINT (so they show up in `docker inspect`).
#
# Theme: AIAMSBS "Dark Cyber" (BACKLOG #72).
#   * Operator constraint: NO white background. Pre-#72 the background
#     was #ffffff (Streamlit default). Now flipped to deep-navy.
#   * primaryColor = cyan accent for buttons / focus rings.
#   * secondaryBackgroundColor = panel surface (cards, sidebar, widgets).
#   * textColor = light slate (high contrast on dark navy).
#   * Status colors (success/warn/danger) live in theme.py so they stay
#     consistent across pages.
#
# To swap palettes later, edit these 4 lines + the :root vars in
# theme.py — nothing else. Page code never references colors directly.

[theme]
base = "dark"
primaryColor = "#00d4ff"                 # cyan accent
backgroundColor = "#0b1220"              # deep navy (was #ffffff)
secondaryBackgroundColor = "#0f1b2e"     # panel surface
textColor = "#e6edf3"                    # light slate
font = "sans serif"

[server]
# Headless mode is set on the CLI in Dockerfile ENTRYPOINT; duplicate here
# so a `streamlit run` from inside the container also behaves headless.
headless = true
port = 8501
# Allow runOnSave (set via CLI in Dockerfile) but disable the XSRF cookie
# check — Streamlit's own auth (we add bcrypt on top) doesn't need it.
enableXsrfProtection = false
# 0.0.0.0 is set via CLI in Dockerfile; duplicate here for clarity.
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
# No telemetry / error reporting to Streamlit's cloud. v1.0 is on-prem.
toolbarMode = "minimal"
showErrorDetails = false

[logger]
level = "info"
